name: CI

on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
    branches: [master, develop]

# 最小权限：本流水线只读取代码、写出 workflow 产物；
# statuses:write 是给「失败摘要上报」用的 —— Actions 的日志与 artifact 下载都要求 admin 权限
# （实测匿名 GET /actions/jobs/{id}/logs → 403 Must have admin rights），
# 没有令牌的人只能看到「哪个 step 红了」而看不到原因。commit status 对 public 仓匿名可读，
# 把摘要写进去后，任何人 `curl .../commits/<sha>/statuses` 都能读到定位信息（2026-10-12）。
permissions:
  contents: read
  statuses: write

jobs:
  compat-matrix:
    name: "基线构建守护（兼容矩阵）JDK ${{ matrix.jdk }} × SB ${{ matrix.sb }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠️⚠️ 这两个维度的取值是**实测收敛**出来的，不要凭直觉加值（2026-10-12）。
        #
        # ① JDK 只能 25，不能加 21：
        #    项目大量使用 java.lang.ScopedValue（全仓 48 个文件），它在 **JDK 25 才转正**
        #    （JEP 506）；JDK 21 下仍是预览 API，而 pom 里 maven.compiler.release=25 且
        #    **没有**开 --enable-preview（pom.xml:26）。实测 JDK 21 两格编译直接失败：
        #      [ERROR] java.lang.ScopedValue 是预览 API，默认情况下处于禁用状态
        #    要支持 JDK 21 就等于要求「运行时也全程预览」，不做。
        #
        # ② SB 只能当前基线，暂不能加 4.0.0：
        #    实测 SB 4.0.0 **编译能通过、但产物起不来** —— 这不是 Boot 的锅，是本仓的
        #    pivotos-dependencies 显式仲裁了 jackson2.version=2.21.4，而 Boot 4.0.0 的 BOM
        #    把 jackson-annotations 锁在 2.20，两者在同一 classpath 错配，databind 初始化时
        #    去找已从 annotations 2.20 移除的 JsonSerializeAs：
        #      ExceptionInInitializerError: com/fasterxml/jackson/annotation/JsonSerializeAs
        #      → Flyway bean 创建失败 → 依赖它的 Mapper/Service 整链崩 → 应用起不来
        #    即：**这一格会让 CI 显示绿色，却交付一个起不来的包**（比红灯危险得多）。
        #
        # ③ 本 job 只跑 `package -DskipTests`，证明的是「能编译打包」，
        #    **不能证明「产物能运行」** —— 运行能力由下面的 test job 与本地 E2E 兜。
        #
        # ④ 想新增维度/取值，先在本机跑 `python3 scripts/ops/ci_local_simulate.py --simulate`，
        #    本地都过不了的组合不要提交（本流水线历史上从未在 GitHub Actions 上真绿过，
        #    根因之一就是往 matrix 里塞了没人验证过的组合）。
        jdk: ['25']
        sb: ['4.1.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: 编译打包（生产纪律 -DskipTests）
        run: mvn -B clean package -DskipTests -Dspring-boot.version=${{ matrix.sb }} -Dmaven.compiler.release=${{ matrix.jdk }}

      # 这一步是把「手工做了很多轮的收口动作」搬进流水线：
      # fat jar 字节数**不能当指纹**（zip 条目存 mtime，同份代码两次打包字节数不同），
      # 内层 pivotos 构件的版本号才是硬证据；顺带验证默认形态没有把 cloud/nacos 打进去。
      - name: 构件指纹核对（内层构件版本 + 形态残留红线）
        run: |
          python3 scripts/ops/check_jar_artifacts.py \
            --forbid spring-cloud --forbid nacos \
            --json target/ci-fingerprint-jdk${{ matrix.jdk }}-sb${{ matrix.sb }}.json

      # if: always() 是必须的：编译挂掉的那一版，恰恰是最需要留证据的时候。
      # if-no-files-found: error 也是必须的：缺省 warn 会让「路径写错」静默归档一个空包。
      - name: 归档 fat jar（仅主干/Release，PR 不占配额）
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fatjar-jdk${{ matrix.jdk }}-sb${{ matrix.sb }}
          path: pivotos-admin-server/target/*.jar
          retention-days: 7
          if-no-files-found: error

      - name: 归档构建指纹
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jar-fingerprint-jdk${{ matrix.jdk }}-sb${{ matrix.sb }}
          path: target/ci-fingerprint-jdk${{ matrix.jdk }}-sb${{ matrix.sb }}.json
          retention-days: 30
          if-no-files-found: error

  test:
    name: "全量测试（JDK 25 × SB 4.1 + MySQL/Redis）"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # Redis **刻意不放在 services 里**：services 只接受 image/ports/options，
      # 没有 docker run 的 command 参数，而我们需要 `redis-server --requirepass root_ci`。
      # （2026-10-12 实测：redis:8 官方镜像不支持 REDIS_ARGS 之类的等价环境变量，
      #   加了也照样无密码 —— 所以只能自己 docker run，见下面的「启动 Redis」步骤。）
      #
      # 为什么**必须**带密码：Redisson 拿到**空字符串**密码也照样发 `AUTH ""`，
      # Redis 8 会直接拒绝 —— `ERR AUTH <password> called without any password configured`，
      # 表层现象是测试的 IllegalStateException: Failed to load ApplicationContext，
      # 根因却在 Bean 创建深处的 RedisConnectionException（CI 红了三轮才靠摘要挖出来）。
      # 让容器带密码，与 dev 环境一致（dev 的 Redis 也是带密码的）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 启动 Redis（带密码，与 dev 形态一致）
        run: |
          docker run -d --name pivotos-ci-redis -p 6379:6379 redis:8 redis-server --requirepass root_ci
          for i in $(seq 1 30); do
            if docker exec pivotos-ci-redis redis-cli -a root_ci --no-auth-warning ping 2>/dev/null | grep -q PONG; then
              echo "Redis 就绪（带密码）"; exit 0
            fi
            sleep 2
          done
          echo "Redis 未在 60s 内就绪"; docker logs pivotos-ci-redis; exit 1
      # 预建 8 个测试库，且字符集/排序规则与 dev 库一致（utf8mb4_general_ci）。
      # 不预建的话，库由连接串的 createDatabaseIfNotExist=true 自动建，
      # 用的是**服务器的默认排序规则** utf8mb4_0900_ai_ci —— 与日常开发库不同，
      # 硬生生多出一处「本机绿、CI 红」的环境差异。库名与 reset_test_databases.py 的白名单一致。
      - name: 预建测试库（字符集与 dev 一致）
        run: |
          CID=$(docker ps --filter "ancestor=mysql:8.4" --format '{{.ID}}' | head -1)
          for db in pivotos_test test test_message test_tenant test_tenant_s1 test_tenant_s2 test_tenant_d1 test_tenant_d2; do
            docker exec "$CID" mysql -uroot -proot_ci \
              -e "CREATE DATABASE IF NOT EXISTS $db DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci"
          done
          docker exec "$CID" mysql -uroot -proot_ci -e "SHOW DATABASES"

      - name: 全量测试（ArchUnit A1-A7 随 verify 一并执行）
        # ⚠️ 这里的变量名必须与测试配置里真正消费的名字一致，否则注入毫无效果且不报错。
        # （2026-10-11 修复：此前注入的是 MYSQL_HOST / MYSQL_DB / REDIS_* 一组名字，
        #   而各模块测试 yml 全部硬编码了 dev 主机 IP —— 结果 CI 的 test job 从未真正
        #   连上过它自己起的 MySQL/Redis 容器。现在两侧统一为 PIVOTOS_TEST_* 系列，
        #   并由 `python3 scripts/ops/check_ci_wiring.py` 守着不再漂移。）
        # 数据库名不需要注入：每个模块用各自的独立测试库（system 用 test、message 用
        # test_message、tenant 用 test_tenant*），且连接串带 createDatabaseIfNotExist=true。
        env:
          PIVOTOS_TEST_MYSQL_HOST: 127.0.0.1
          PIVOTOS_TEST_MYSQL_PORT: '3306'
          PIVOTOS_TEST_MYSQL_USERNAME: root
          PIVOTOS_TEST_MYSQL_PASSWORD: root_ci
          PIVOTOS_TEST_REDIS_HOST: 127.0.0.1
          PIVOTOS_TEST_REDIS_PORT: '6379'
          # ⚠️ 绝不能是空串：空串会让 Redisson 发 AUTH "" 被 Redis 8 拒绝（详见上方注释）
          PIVOTOS_TEST_REDIS_PASSWORD: root_ci
        run: mvn -B clean verify

      # 必须在 verify **之后**执行：verify 会清空并重建 target，报告是它跑出来的。
      # 冻结成 JSON 是为了留一条「这一轮到底跑了多少条」的可回溯证据——
      # 历史出现过同一份代码用不同命令能差出 10 条的情况。
      - name: 冻结 IT 计数
        if: always()
        run: python3 scripts/ops/count_tests.py --json target/ci-test-counts.json

      # 失败时把摘要写进 commit status：唯一一条「不持令牌也能读到失败原因」的通道。
      # continue-on-error 是刻意的：上报只是锦上添花，它自己挂了不该改变构建结论。
      - name: 失败摘要上报（写进 commit status，匿名可读）
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ops/ci_failure_digest.py --repo ${{ github.repository }} --sha ${{ github.sha }}

      - name: 归档测试报告（surefire / failsafe）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**/*.xml
            **/target/surefire-reports/**/*.txt
            **/target/failsafe-reports/**/*.xml
          retention-days: 7
          if-no-files-found: error

      - name: 归档 IT 计数冻结产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-counts
          path: target/ci-test-counts.json
          retention-days: 30
          if-no-files-found: error
