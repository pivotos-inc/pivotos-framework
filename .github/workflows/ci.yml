name: CI

on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
    branches: [master, develop]

jobs:
  compat-matrix:
    name: "兼容矩阵 JDK ${{ matrix.jdk }} × SB ${{ matrix.sb }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '25']
        sb: ['4.0.0', '4.1.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: 编译打包（生产纪律 -DskipTests）
        run: mvn -B clean package -DskipTests -Dspring-boot.version=${{ matrix.sb }} -Dmaven.compiler.release=${{ matrix.jdk }}

  test:
    name: "全量测试（JDK 25 × SB 4.1 + MySQL/Redis）"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 全量测试（ArchUnit A1-A7 随 verify 一并执行）
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_DB: pivotos_test
          MYSQL_USER: root
          MYSQL_PASSWORD: root_ci
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: ''
        run: mvn -B clean verify
