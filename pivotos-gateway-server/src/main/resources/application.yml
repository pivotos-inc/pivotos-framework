server:
  port: 8090

spring:
  application:
    name: pivotos-gateway
  # ===== Nacos 配置中心导入（V3-S3 ⑤）=====
  # ⚠️ optional: 前缀是硬要求：去掉它，「Nacos 不可达 / 鉴权失败 / dataId 不存在 /
  #    默认形态 classpath 上没有 nacos: 解析器」四种情况都会直接把启动打断。
  #    只有 -P alibaba 打进去的 jar 才认识 nacos: 前缀；默认形态下这两行被静默忽略。
  # dataId 两段：网关公共配置 + 环境覆盖（环境由 PIVOTOS_NACOS_CONFIG_ENV 决定，默认 dev）。
  # 与 admin-server 刻意不共用 dataId：网关路由变更的爆炸半径比后端配置大得多，
  # 共用一份等于把「改网关路由」和「改后端配置」绑成一次发布。
  config:
    import:
      - optional:nacos:pivotos-gateway.yaml
      - optional:nacos:pivotos-gateway-${PIVOTOS_NACOS_CONFIG_ENV:dev}.yaml
  cloud:
    # ===== Nacos 连接信息（同源占位符，凭据一律环境变量，不落 git）=====
    # ⚠️ 缩进必须是 2 空格：spring 的直接子项写成 4 空格会落进别的子树，属性静默失效且不报错。
    nacos:
      config:
        server-addr: ${PIVOTOS_NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${PIVOTOS_NACOS_USERNAME:}
        password: ${PIVOTOS_NACOS_PASSWORD:}
        namespace: ${PIVOTOS_NACOS_NAMESPACE:}
        group: ${PIVOTOS_NACOS_GROUP:DEFAULT_GROUP}
        # dataId 后缀必须与 file-extension 一致，否则内容解析不到
        file-extension: yaml
        # optional: 已兜住失败，这里只是别让不可达时白等 30s
        timeout: 3000
      discovery:
        # 网关默认不注册自身：入口侧直接指向网关，它不需要被服务发现找到
        enabled: ${PIVOTOS_NACOS_GATEWAY_DISCOVERY_ENABLED:false}
        fail-fast: false
        # 真正管「Nacos 不可达也不许把进程带崩」的是这个开关，fail-fast=false 只管是否快速失败
        failure-tolerance-enabled: true
    gateway:
      server:
        webmvc:
          routes:
            # 单体形态：网关把 /api/** 转发到本机 admin-server（8080）。
            # 微服务形态下把 uri 换成 lb://pivotos-admin-server 即可走注册中心。
            - id: admin-server
              uri: http://127.0.0.1:8080
              order: 0
              predicates:
                # 单体形态下后端路由没有 /api 前缀（直连是 /system/auth/login），
                # 两个前缀都要放行，否则网关转发 404——这个坑只有真穿透一次才会暴露。
                - Path=/api/**,/system/**

pivotos:
  cloud:
    # 网关自身不持有业务上下文，传播走 local 通道的同一套编解码器
    provider: local

logging:
  level:
    com.pivotos: INFO
    org.springframework.cloud.gateway: INFO
