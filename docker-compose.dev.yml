name: pivotos-dev

# PivotOS 开发中间件一键拉起：mysql8.4 / redis8 / minio / xxl-job-admin
# 用法：cp .env.example .env.dev 按实际修改 → docker compose -f docker-compose.dev.yml --env-file .env.dev up -d
# 账号密码只允许出现在 .env.dev（gitignored），禁止提交真实凭据

services:
  mysql:
    image: mysql:8.4
    container_name: pivotos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.dev 中配置}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化脚本挂载：仅数据卷为空的首启执行（S9 验收项）
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8
    container_name: pivotos-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env.dev 中配置}", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-06T17-38-46Z
    container_name: pivotos-minio
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env.dev 中配置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env.dev 中配置}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: pivotos-xxl-job-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-}
    ports:
      - "8081:8080"

  # ST-SEARCH（S121）：搜索 Starter 的可选中间件。
  # 声明式登记但默认不拉起（ES 单节点常驻占用 1G+ 内存，会拖慢日常开发环境），按需启动：
  #   docker compose -f docker-compose.dev.yml --env-file .env.dev --profile search up -d
  # 镜像取 8.19.x 与 pivotos-starter-search-es-java（es-java 8.19.18 客户端）对齐；
  # easy-es 实现内嵌 es-java 7.17.28（面向 ES 7.17），要实测该实现请把镜像换成 7.17.28。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: pivotos-es
    restart: unless-stopped
    profiles: [ "search" ]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  minio-data:
  es-data:
