# PivotOS 前端 Nginx 反代配置（/api 统一前缀版，2026-08-14 起为标准样例）
# 设计原则：前端 baseURL='/api'，所有 API 请求带 /api 前缀，Nginx 统一剥离后反代后端。
# /api 前缀天然隔离 API 与 SPA 路由，无需 Accept 头嗅探，新插件零配置。
# 使用方式：放入 Nginx conf.d/ 目录（如 /etc/nginx/conf.d/pivotos.conf），
# 修改 root 为实际解压目录后 nginx -t && nginx -s reload。
# 生产域名（2026-08-15）：PC = pivotos-pc.293242.com，H5 = pivotos-h5.293242.com；
# 经 1Panel 创建网站时可由面板管理 server 块，本文件的 location /api/ 与 / 规则照搬即可（HTTPS 由面板证书接管）。

# WebSocket 升级头透传（预留；无 Upgrade 时 Connection 置空保证 HTTP/1.1 长连）
map $http_upgrade $pivotos_connection_upgrade {
    default upgrade;
    ''      "";
}

# 后端 admin-server 地址（生产：http://10.0.0.7:8080）
upstream pivotos_backend {
    server 10.0.0.7:8080;
}

# ============ PC 管理端（示例端口 80）============
server {
    listen 80;
    server_name pivotos-pc.293242.com;  # PC 管理端演示域名

    # PC 端静态文件解压目录（pivotos-pc-dist.zip 解压目标）
    root /www/pivotos/pc;
    index index.html;

    client_max_body_size 50m;   # 文件插件上传上限，按需调

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # API 反代：剥离 /api 前缀后转发到后端（与 Vite 代理 rewrite 语义一致）
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://pivotos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pivotos_connection_upgrade;
        # 全局关缓冲：SSE/流式端点（AI 对话及未来新增）免单独 location
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # SPA 路由：静态文件优先，不存在则回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============ H5 移动端（示例端口 81）============
server {
    listen 81;
    server_name pivotos-h5.293242.com;  # H5 移动端演示域名

    # H5 端静态文件解压目录（pivotos-h5-dist.zip 解压目标）
    root /www/pivotos/h5;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # API 反代（与 PC 端相同规则；named location 不能跨 server 共享，重复一份）
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://pivotos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pivotos_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
