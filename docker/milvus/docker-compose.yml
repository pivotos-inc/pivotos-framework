# ============================================================
# Milvus Standalone — 1Panel / Docker Compose 部署文件
# ============================================================
# 使用方式（1Panel 面板）：
#   1. 容器 → 编排 → 新建编排
#   2. 粘贴本文件内容
#   3. 启动即可
#
# 使用方式（命令行）：
#   mkdir -p /opt/milvus && cd /opt/milvus
#   保存本文件为 docker-compose.yml
#   docker compose up -d
#
# 组件说明：
#   etcd         — Milvus 元数据存储
#   minio        — Milvus 对象存储（向量数据持久化）
#   standalone   — Milvus 向量数据库主体
#   attu         — Milvus Web 管理界面（可选）
#
# 连接信息：
#   gRPC 端口:  19530（Java SDK 连接用）
#   健康检查:   9091
#   Attu UI:    http://<服务器IP>:8000（默认账号 root / Milvus）
#   WebUI:      http://<服务器IP>:9091/webui/
# ============================================================

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "8000:3000"
    depends_on:
      - standalone
    restart: unless-stopped

networks:
  default:
    name: milvus
