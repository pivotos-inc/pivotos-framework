server:
  port: 8080

spring:
  application:
    name: pivotos-admin-server
  profiles:
    active: dev
  # Flyway：脚本在各 Plugin 自己的 jar 内 db/migration/，classpath 扫描会跨 jar 合并
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

sa-token:
  token-name: Authorization
  timeout: 86400
  is-print: false
  is-log: false

mybatis-plus:
  global-config:
    banner: false

# API 文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html
  default-flat-param-object: true

# PivotOS 自定义配置
pivotos:
  deploy-mode: monolith
