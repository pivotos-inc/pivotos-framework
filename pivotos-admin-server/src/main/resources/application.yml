server:
  port: 8080

spring:
  application:
    name: pivotos-admin-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # Flyway：脚本在各 Plugin 自己的 jar 内 db/migration/，classpath 扫描会跨 jar 合并
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
  # AI 模型接入（阿里云百炼 DashScope · OpenAI 兼容模式）
  # API Key 优先级：环境变量 DASHSCOPE_API_KEY > profile 配置兜底值（见 application-dev.yml）
  # 程序运行时可从数据库动态覆盖（ChatModelFactory 按 provider.code 装配）；此处为静态兜底
  ai:
    # S46：anthropic/gemini starter 的自动装配以 spring.ai.model.chat 为开关且 matchIfMissing=true，
    # 不关会激活出 3 个 ChatModel Bean 顶掉 ChatClient 自动装配。动态供应商由 plugin-ai 的
    # ChatModelFactory 按 provider.code 手工装配，这里只保留 openai 静态兜底（starter-ai 单一职责）
    model:
      chat: openai
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      # Spring AI 2.0 底层为官方 openai-java SDK，base-url 须含 /v1（SDK 直接追加 /chat/completions）
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3
    # S97 A2：MCP Server（WebMVC SSE）——端点 GET /sse + POST /mcp/message；
    # S98 建实端点防护：McpEndpointAuthFilter 强制登录（匿名 401），工具调用再经
    # GuardedToolCallback 过「注册检查 → 角色白名单 → 二次确认预检 → 全量审计」；
    # MCP 客户端两个请求均须携带 Authorization 头（与登录 token 同值）
    mcp:
      server:
        name: pivotos-mcp-server
        version: 2.15.0

sa-token:
  token-name: Authorization
  timeout: 86400
  # 关闭 Cookie 写入/读取：三端均为 header 裸值传 token（axios/uni.request/fetch SSE），
  # 默认 true 会在登录时 Set-Cookie，H5 登出只清 localStorage 后 Cookie 仍可兜底过鉴权（S23 坑 2）
  is-read-cookie: false
  is-print: false
  is-log: false

# WarmFlow 工作流引擎（S55 2.5-F1 引擎底座）
warm-flow:
  enabled: true
  ui: true              # 内置设计器 UI 装配（/warm-flow-ui/**）；v2.14.0 D1 起入口由 pivotos.workflow.legacy-designer 守卫拦截，
                        # 此处保持 true 以便仅改一处开关即可回滚到并存态（jar 依赖保留不剔除，剔除留 v2.15.0 再议）
  banner: false
  token-name: Authorization   # 复用 Sa-Token 同一 header
  logic_delete: true          # WarmFlow 自带逻辑删除（del_flag）
  logic_delete_value: 2
  logic_not_delete_value: 0

mybatis-plus:
  global-config:
    banner: false

# API 文档（Knife4j Next 增强 UI，底层复用 SpringDoc OpenAPI 3）
springdoc:
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

# PivotOS 自定义配置
pivotos:
  deploy-mode: monolith
  migration:
    # 迁移工作区使用绝对路径，避免因启动目录不同（mvn spring-boot:run vs java -jar）导致路径漂移
    workspace: ${PIVOTOS_MIGRATION_WORKSPACE:/Users/huweilong/Documents/File/Project/PivotOS Technology/PivotOS/pivotos-framework/pivotos-admin-server/data/migration}
  mybatis:
    # 字段加密密钥（AES，16/24/32 位）：ai_api_key.api_key 等 @FieldEncrypt 字段落库加密
    # dev 默认值恰 16 位仅供本地联调，生产必须用环境变量覆盖
    field-encrypt-key: ${PIVOTOS_FIELD_ENCRYPT_KEY:pivotos-dev-key!}
  kb:
    # 默认向量存储类型：simple（本地零中间件兜底，Milvus 服务端未部署）/ milvus（部署后可由环境变量切换）
    vector-store:
      type: ${PIVOTOS_KB_VECTOR_STORE_TYPE:simple}
      simple:
        data-path: ./data/kb/simple
        file-name: kb-store.json
    # OCR（S76 实测）：KB 图片/扫描版 PDF 文本提取，默认启用，未安装 tesseract 自动降级为仅 Tika
    # macOS（brew）：JVM 需附加 -Djna.library.path=/opt/homebrew/lib 且显式配置 tessdata-path
    # Linux（apt/yum）：原生库在系统默认搜索路径，tessdata-path 一般为 /usr/share/tesseract-ocr/5/tessdata
    # 部署口径详见《07-部署上线流程》2.4，踩坑详见《S76-OCR-踩坑记录》
    # ocr:
    #   enabled: true
    #   tessdata-path: /opt/homebrew/share/tessdata
    #   languages: chi_sim+eng
  search:
    # ST-SEARCH（S121）：搜索抽象层。type=simple 为进程内内存兜底（零中间件，重启即失），
    # 生产接入 ES 时引入 pivotos-starter-search-easy-es（ES 7.17）或 -es-java（ES 8.x/9.x）
    # 并把 type 改为 easy-es / es-java；未命中已注册实现时自动回落 simple 并打 WARN（配错也能起服）
    type: ${PIVOTOS_SEARCH_TYPE:simple}
    # 多环境共用一套 ES 时用它做索引名前缀隔离，留空表示不加前缀
    index-prefix: ${PIVOTOS_SEARCH_INDEX_PREFIX:}
    # es-java 实现（官方 elasticsearch-java 8.19.18，面向 ES 8.x/9.x）。
    # 未引入 pivotos-starter-search-es-java 模块时，即便 type=es-java 也会回落到 simple 并打 WARN（配错也能起服）。
    # 具体地址/口令写在各环境的 application-{profile}.yml（dev 用 175.24.176.176，test 用 10.0.0.7）。
    es-java:
      uris: ${PIVOTOS_ES_JAVA_URIS:http://localhost:9200}
      username: ${PIVOTOS_ES_JAVA_USERNAME:}
      password: ${PIVOTOS_ES_JAVA_PASSWORD:}
      connect-timeout: 3000
      socket-timeout: 30000
      # 兼容模式：用 8.19 客户端连 ES 7.x 服务端时置 true（发 compatible-with=7 官方兼容头）。
      # 连 8.x / 9.x 服务端必须保持 false——实测 ES 9.5.3 会拒绝 compatible-with=7
      # （media_type_header_exception 400）；启动期版本探测会据此判不可用并回落 simple。
      compatibility-mode: ${PIVOTOS_ES_JAVA_COMPATIBILITY_MODE:false}
      # ES 默认近实时（写后最多 1s 才可检索）。置 true 改为 refresh=wait_for：写后立即可检索，
      # 代价是每次索引写入多一次 refresh 开销，高频写链路（操作日志）不建议开。
      refresh-on-write: ${PIVOTOS_ES_JAVA_REFRESH_ON_WRITE:false}
    # S122 业务检索开关：每条链路可单独关（关闭即回到 MyBatis 查询，零数据/零迁移的一键回滚）
    # 数据来源：写侧双写索引 + 起服时索引为空则从数据库全量回灌（simple 内存实现重启即失，靠它恢复）
    oper-log:
      enabled: ${PIVOTOS_SEARCH_OPER_LOG_ENABLED:true}
      bootstrap-on-start: true
      bootstrap-max-rows: 50000
    kb-doc:
      enabled: ${PIVOTOS_SEARCH_KB_DOC_ENABLED:true}
      bootstrap-on-start: true
      bootstrap-max-rows: 20000
  # ---------- ST-DATAINSPECT（S130）：通用数据监控（DB / ES / Redis） ----------
  # 铁律：权限（monitor:data:*）只决定「能不能点按钮」；下面的安全过滤永远硬生效，二者不可互相替代。
  # 即使超管（*:*），DROP / DELETE / UPDATE / INSERT / ALTER / TRUNCATE / GRANT / 多语句 / 注释绕过 也一律拒绝。
  datainspect:
    # 总开关；false 时所有组件一律降级（200 + available=false + reason）
    enabled: ${PIVOTOS_DATA_INSPECT_ENABLED:true}
    # 自由 SQL 开关（高危）。生产默认关闭，见 application-prod.yml
    query-enabled: ${PIVOTOS_DATA_INSPECT_QUERY_ENABLED:true}
    # 默认返回行数 / 硬上限（请求参数不可突破）
    max-rows: 200
    hard-max-rows: 1000
    # 单条语句最大字符数
    max-sql-length: 4000
    # JDBC 查询超时（秒）——超时熔断，与行数上限共同防拖库
    query-timeout-seconds: 5
    # 慢语句阈值（毫秒）：超过打 WARN 日志（本轮不做告警持久化）
    slow-threshold-ms: 1000
    # 租户改写：裸 JDBC 不经过 MyBatis 租户拦截器，这里必须自己补；<b>超管不豁免，无开关</b>
    force-tenant-scope: true
    # 敏感列脱敏（按列名正则）
    mask-enabled: true
    mysql:
      # false = 只查白名单表（安全默认）
      allow-all-tables: ${PIVOTOS_DATA_INSPECT_ALLOW_ALL_TABLES:false}
      table-whitelist: ${PIVOTOS_DATA_INSPECT_TABLE_WHITELIST:}
      schema-whitelist: ${PIVOTOS_DATA_INSPECT_SCHEMA_WHITELIST:}
      tenant-id-column: tenant_id
    es:
      max-rows: 100
      max-items: 500
    redis:
      scan-count: 500
      max-keys: 1000
      value-truncate-bytes: 2048
  workflow:
    # D1（v2.14.0）：旧内置设计器（warm-flow 自带 jar，/warm-flow-ui/）入口退役。
    # false / 缺省 —— 守卫拦截旧入口（HTTP 410 + code=4100），单入口为 bpmn-js 新版设计器；
    # true —— 放行旧入口，回滚到并存态（仅改这一处即可，无需重新打包）
    legacy-designer:
      enabled: ${PIVOTOS_WORKFLOW_LEGACY_DESIGNER_ENABLED:false}
