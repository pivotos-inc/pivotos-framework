spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # 开发库 pivotos；中间件已迁至公网服务器 175.24.176.176（2026-07-31 搬迁）
          url: jdbc:mysql://175.24.176.176:3306/pivotos?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
          username: root
          password: ${MYSQL_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
  data:
    redis:
      host: 175.24.176.176
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 5s

  ai:
    # dev 兼容：统一从环境变量读取（本机 .env.dev / shell export 注入），仓库内不再保留真实 Key 默认值
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
    vectorstore:
      milvus:
        client:
          host: 175.24.176.176
          port: 19530
        database-name: default
        collection-name: pivotos_kb
        embedding-dimension: 1024
        initialize-schema: true
        metric-type: COSINE

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.pivotos: debug
    org.dromara.warm.flow: debug
    org.springframework.web.servlet.mvc.method.annotation: trace

pivotos:
  tenant:
    enabled: true        # 默认 false，不写=单租户
    mode: column         # column / schema / datasource
  # 文件存储：腾讯云 COS（测试环境）
  file:
    storage-type: s3
    vendor: cos
    endpoint: https://cos.ap-shanghai.myqcloud.com
    access-key: ${PIVOTOS_COS_ACCESS_KEY:}
    secret-key: ${PIVOTOS_COS_SECRET_KEY:}
    bucket: huweilong-1440252518
    region: ap-shanghai
    public-url: https://cos.293242.com
  # XXL-Job 调度中心（测试环境本地）
  job:
    admin-addresses: http://175.24.176.176:8100
    app-name: pivotos-executor
    port: 9999
    group-id: 3   # XXL-Job admin 中 pivotos-executor 执行器组 ID
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
  # 微信小程序（测试号）
  wechat:
    miniapp:
      appid: wx0a426f6d4bce0b5c
      # 枢磐·智域小程序（比赛作品）AppID/Secret，默认从环境变量读取
      configs:
        mind:
          appid: ${PIVOTOS_MIND_MINIAPP_APPID:}
          secret: ${PIVOTOS_MIND_MINIAPP_SECRET:}
