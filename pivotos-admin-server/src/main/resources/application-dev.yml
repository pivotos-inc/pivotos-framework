pivotos:
  tenant:
    enabled: true        # 默认 false，不写=单租户
    mode: column         # column / schema / datasource
  # 文件存储：腾讯云 COS（测试环境）
  file:
    storage-type: s3
    vendor: cos
    endpoint: https://cos.ap-shanghai.myqcloud.com
    access-key: AKIDKhrqb9UbVCg3D9B9AA4qPuENXUJvJUSC
    secret-key: ayBIG1aw51jEVlqiNtDKOL7i5HJ8k9LO
    bucket: huweilong-1440252518
    region: ap-shanghai
    public-url: https://cos.293242.com
  # XXL-Job 调度中心（测试环境本地）
  job:
    admin-addresses: http://127.0.0.1:8101
    app-name: pivotos-dev-executor
    port: 9999
    group-id: 1   # XXL-Job admin 中 pivotos-executor 执行器组 ID
    access-token: qaz123
  # A4-1 代码索引与定位（S110）：默认关闭（要扫仓库源码），dev 显式开启
  ai:
    coding:
      locate:
        enabled: true
        top-n: 5              # LLM 粗筛候选数
        keyword-top-k: 5      # 确定性关键词召回条数（与粗筛选并集，保召回下限）
        max-candidates: 8     # 进入并行精定位的候选上限
        repos:
          - name: fw
            root: /Users/huweilong/Documents/File/Project/PivotOS Technology/PivotOS/pivotos-framework
            includes:
              - pivotos-plugins/**/src/main/java/**/*.java
          - name: ui
            root: /Users/huweilong/Documents/File/Project/PivotOS Technology/PivotOS/pivotos-ui
            includes:
              - apps/admin/src/**/*.ts
              - apps/admin/src/**/*.vue
      # S111 A4-2 修改型：会写工程文件，dev 显式开启；落盘路径走与生成型同一道白名单
      # 注意缩进：modify 与 locate 同级（同属 pivotos.ai.coding），缩进错了会静默绑不上
      modify:
        enabled: true
        gate:
          build-enabled: true      # 落盘后跑 mvn compile / pnpm typecheck，不过即回滚
          timeout-seconds: 600
    # A5-1 工具多步编排（S116）：与 locate/modify 同为「能力显式开启」口径，dev 显式开启
    # 注意缩进：orchestrator 与 coding 同级（同属 pivotos.ai），缩进错了会静默绑不上
    orchestrator:
      enabled: true
      max-steps: 10              # 单条计划步骤上限（防 LLM 产出失控长链）
      max-intent-length: 500
      model: qwen-plus           # 留空则取供应商默认模型
      # 排除写工程源码的工具：改源码属 A4 评审面职责，编排面不给旁路
      excluded-tools:
        - writeCodeFile
      # A5-2 重试（S117）：只对「只读步骤 + 工具本体执行失败」重试；
      # 写步骤 write-enabled=false——写工具非幂等（实测连发两次站内信，消息数 +2），
      # 且守卫把异常吞成文本，判不了失败发生在副作用前还是后，重试等于重复副作用。
      # 注意缩进：retry/circuit 与 enabled 同级（同属 orchestrator），缩进错了静默失效。
      retry:
        enabled: true
        max-attempts: 2
        write-enabled: false
        backoff-ms: 300
      # A5-2 熔断（S117）：单条计划的重试预算，防故障态下反复重试放大调用量
      circuit:
        enabled: true
        max-retries-per-plan: 3
    # A4E 审批建议增强（S117）：受控自动预审——默认关闭（能力显式开启口径）。
    # 注意缩进：approval 与 coding / orchestrator 同级（同属 pivotos.ai），
    # auto-approve 与 approval 的下级属性同级；缩进挂错一级会静默失效。
    approval:
      auto-approve:
        enabled: false
        require-policy-kb: true
        require-single-approver: true
        amount-variable-key: ""
        max-amount: 0
        message: "AI 预审自动通过（依据制度检索结论，审批人已授权自动预审）"
  # 检索（S121/S122）：dev 环境真连 ES——175.24.176.176:9200。
  # 2026-09-30 实测：服务端 ES 9.5.3 单节点、HTTP 明文 + Basic 认证（elastic/Elastic_RGRSPM）；
  # 客户端 elasticsearch-java 8.19.18 与服务端 wire 兼容（服务端 minimum_wire_compatibility_version=8.19.0），
  # dev 独享该集群故索引名不加前缀。
  # 一键回退：PIVOTOS_SEARCH_TYPE=simple（回内存兜底）或 PIVOTOS_SEARCH_OPER_LOG_ENABLED=false（回数据库查询）。
  # 多版本支持（S127）：同一份 es-java 实现可连 7.17 / 8.x / 9.x。
  #   · 连 8.x / 9.x（本 dev 的 9200，ES 9.5.3）——compatibility-mode 保持 false；
  #   · 连 7.x（如 175.24.176.176:9201，ES 7.17.28）——compatibility-mode 置 true 发 compatible-with=7。
  #   二者只改这一个开关，无需换依赖（不做 shade 双客户端）。启动期会打印服务端版本，
  #   版本不在支持区间（7.17 ~ 9.x）或兼容头与版本冲突时自动回落 simple 并打 WARN，不会让应用起不来。
  # ST-DATAINSPECT（S130）：通用数据监控。安全默认——只查白名单表（allow-all-tables=false），
  # 需要放开某张表就在这里加（表白名单是硬生效的安全过滤，与 monitor:data:* 权限无关）
  datainspect:
    mysql:
      table-whitelist:
        - sys_user
        - sys_config
        - sys_notice
        - sys_oper_log
        - sys_login_log
        - sys_job
        - sys_job_log
  search:
    type: ${PIVOTOS_SEARCH_TYPE:es-java}
    es-java:
      uris: ${PIVOTOS_ES_JAVA_URIS:http://175.24.176.176:9200}
      username: ${PIVOTOS_ES_JAVA_USERNAME:elastic}
      password: ${PIVOTOS_ES_JAVA_PASSWORD:Elastic_RGRSPM}
      # 服务端是 9.5.3，必须 false；切到 7.17 服务端时改 true
      compatibility-mode: ${PIVOTOS_ES_JAVA_COMPATIBILITY_MODE:false}
  # 微信小程序（测试号）
  wechat:
    miniapp:
      appid: wx0a426f6d4bce0b5c
      # PivotOS·智域小程序（比赛作品）AppID/Secret，待用户提供后填明文
      configs:
        mind:
          appid: ${PIVOTOS_MIND_MINIAPP_APPID:}
          secret: ${PIVOTOS_MIND_MINIAPP_SECRET:}
