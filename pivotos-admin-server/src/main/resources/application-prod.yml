      host: 10.0.4.15
      port: 6379
      password: W8vh8yGwyXV89Fnl3Czy0V8A
      timeout: 5s

  ai:
    # 向量存储（RAG 知识库）：Milvus 未部署前，生产启动须将 spring.ai.vectorstore.type 置 simple
