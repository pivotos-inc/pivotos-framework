# =====================================================================
# PivotOS 生产环境配置（1Panel 部署 · 2026-08-15）
# 原则：
#  1. 已确认的生产参数以「环境变量优先 + 内置默认值」写入，开箱即启动；
#  2. 未在部署清单中明确的配置与 application-dev.yml 保持一致；
#  3. 敏感项（字段加密密钥 / AI API Key）必须经环境变量注入，不写死。
#
# 必需环境变量（1Panel Java 项目「环境变量」处配置）：
#   DASHSCOPE_API_KEY          阿里云百炼 API Key（AI 对话/向量化能力）
#   PIVOTOS_FIELD_ENCRYPT_KEY  字段级 AES 加密密钥（16/24/32 位，生产勿用 dev 默认值）
# 可选环境变量：
#   XXL_JOB_ACCESS_TOKEN       调度中心通信 Token（与 xxl-job-admin 保持一致，留空不校验）
#   PIVOTOS_KB_VECTOR_STORE_TYPE  向量存储类型（默认 milvus；无 Milvus 时设 simple）
#   MYSQL_*/REDIS_*            覆盖下方默认连接参数
# =====================================================================
spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # 全新库 pivotos：createDatabaseIfNotExist=true 自动建库，表结构由 Flyway 随启动自动迁移
          url: jdbc:mysql://${MYSQL_HOST:10.0.4.15}:${MYSQL_PORT:3306}/${MYSQL_DB:pivotos}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:CBafpG8yDPJHVHiSPE8DDUBU}
          driver-class-name: com.mysql.cj.jdbc.Driver
      druid:
        initial-size: 10
        min-idle: 10
        max-active: 50
  data:
    redis:
      host: ${REDIS_HOST:10.0.4.15}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:W8vh8yGwyXV89Fnl3Czy0V8A}
      timeout: 5s

  ai:
    # 向量存储（RAG 知识库）：与 dev 一致，地址可用环境变量覆盖
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:175.24.176.176}
          port: ${MILVUS_PORT:19530}
        database-name: default
        collection-name: pivotos_kb
        embedding-dimension: 1024
        initialize-schema: true
        metric-type: COSINE

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.pivotos: info

# 生产关闭接口文档
springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false
  production: true

# PivotOS 自定义配置（未提及项与 dev 保持一致）
pivotos:
  tenant:
    enabled: true
    mode: column
  # 文件存储：腾讯云 COS（与 dev 一致；生产桶/密钥如需隔离可经环境变量覆盖）
  file:
    storage-type: s3
    vendor: cos
    endpoint: https://cos.ap-shanghai.myqcloud.com
    access-key: AKIDKhrqb9UbVCg3D9B9AA4qPuENXUJvJUSC
    secret-key: ayBIG1aw51jEVlqiNtDKOL7i5HJ8k9LO
    bucket: huweilong-1440252518
    region: ap-shanghai
    public-url: https://cos.293242.com
  # XXL-Job 调度中心（生产调度中心地址）
  job:
