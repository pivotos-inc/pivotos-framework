# system 插件集成测试配置：连接本地中间件（与 S1 环境一致）
# 注意：使用独立测试库 pivotos_test，绝不触碰开发库 pivotos

spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # 凭据从环境变量读取（本机 .env.dev / shell export）；createDatabaseIfNotExist 首次自动建测试库
          url: jdbc:mysql://175.24.176.176:3306/test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
          username: root
          password: ${PIVOTOS_TEST_MYSQL_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 175.24.176.176
      port: 6379
      password: ${PIVOTOS_TEST_REDIS_PASSWORD:}
      timeout: 5s

sa-token:
  token-name: Authorization
  timeout: 3600
  is-print: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
