# system 插件集成测试配置：连接本地中间件（与 S1 环境一致）
# 注意：使用独立测试库 pivotos_test，绝不触碰开发库 pivotos

spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # 凭据从环境变量读取（本机 .env.dev / shell export）；createDatabaseIfNotExist 首次自动建测试库
          url: jdbc:mysql://${PIVOTOS_TEST_MYSQL_HOST:${MYSQL_HOST:175.24.176.176}}:${PIVOTOS_TEST_MYSQL_PORT:${MYSQL_PORT:3306}}/test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
          username: ${PIVOTOS_TEST_MYSQL_USERNAME:${MYSQL_USER:root}}
          password: ${PIVOTOS_TEST_MYSQL_PASSWORD:${MYSQL_PASSWORD:}}
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${PIVOTOS_TEST_REDIS_HOST:${REDIS_HOST:175.24.176.176}}
      port: ${PIVOTOS_TEST_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${PIVOTOS_TEST_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 5s

sa-token:
  token-name: Authorization
  timeout: 3600
  is-print: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
